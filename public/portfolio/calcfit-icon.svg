  <!-- Discos -->
  <rect x="18" y="72" width="18" height="56" rx="7" fill="#0091B9"/>
  <rect x="44" y="54" width="24" height="92" rx="10" fill="#004E9B"/>
  <rect x="132" y="54" width="24" height="92" rx="10" fill="#004E9B"/>
  <rect x="164" y="72" width="18" height="56" rx="7" fill="#0091B9"/>

  <!-- Pulso: la parte de salud, no solo de gimnasio -->
